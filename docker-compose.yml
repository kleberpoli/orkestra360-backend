services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orkestra360-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_HOST=postgres 
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_PORT_NODE=5672
      - SPRING_RABBITMQ_PORT_MGMT=${SPRING_RABBITMQ_PORT_MGMT}
      - SECURITY_USER_NAME=${SECURITY_USER_NAME:-admin}
      - SECURITY_USER_PASSWORD=${SECURITY_USER_PASSWORD:-admin}
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:- -Xmx512m -Xms256m}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orkestra-network

  postgres:
    image: postgres:15-alpine
    container_name: orkestra360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orkestra-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: orkestra360-rabbitmq
    restart: unless-stopped
    ports:
      - "${SPRING_RABBITMQ_PORT_NODE:-5672}:5672"
      - "${SPRING_RABBITMQ_PORT_MGMT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orkestra-network

networks:
  orkestra-network:
    driver: bridge

volumes:
  postgres_data: